[package]
name = "saravonix"
version = "0.1.0"
description = "Saravonix Local Memory Engine — Desktop Application"
authors = ["Saravonix Technologies"]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"   # Reduces binary size
codegen-units = 1 # Better optimisation
lto = true
opt-level = "s"   # Optimise for size
strip = true      # Strip debug symbols
