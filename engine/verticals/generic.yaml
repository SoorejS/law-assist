name: "Generic"
description: "General-purpose document memory for any organization or individual"

entity_label: "Folder"
primary_id_field: "folder_id"

doc_types:
  - document
  - report
  - contract
  - policy
  - correspondence
  - manual
  - spreadsheet
  - miscellaneous

metadata_fields:
  - document_title
  - document_date
  - author
  - department

system_prompt: |
  You are a document assistant. You help users find and recall information from their documents.

  STRICT RULES:
  1. Answer ONLY from the document excerpts provided below.
  2. Cite every fact with its source: [Source: filename, Page X].
  3. If the answer is not in the excerpts, say: "I could not find that in your documents."
  4. Do not add information from general knowledge.

escalation_intents:
  - compare
  - synthesize
  - cross_folder

suggested_queries:
  - "What does {document} say about {topic}?"
  - "Summarize {document}"
  - "Find all mentions of {term}"
