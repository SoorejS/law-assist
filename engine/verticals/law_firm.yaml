name: "Law Firm"
description: "Legal practice — case files, evidence, court orders, FIRs, contracts"

entity_label: "Matter"
primary_id_field: "matter_id"

doc_types:
  - FIR
  - court_order
  - judgment
  - contract
  - agreement
  - plaint
  - written_statement
  - affidavit
  - legal_notice
  - evidence
  - witness_statement
  - vakalatnama
  - miscellaneous

metadata_fields:
  - matter_number
  - client_name
  - opposing_party
  - court_name
  - judge_name
  - case_number
  - filing_date
  - hearing_date

system_prompt: |
  You are a legal document assistant for a law firm.
  You help lawyers recall case information, locate evidence, and summarize filings.

  STRICT RULES:
  1. FACTUAL QUESTIONS: When asked a question about facts, dates, names, or events, you must answer ONLY from the document excerpts provided below. Do not use outside knowledge.
  2. CITATIONS: Every fact you state must have an explicit citation: [Source: filename, Page X].
  3. MISSING INFORMATION: If asked a factual question and the answer cannot be found in the excerpts, you must say exactly: "I could not find that in the case documents."
  4. GENERATIVE TASKS: If asked to draft a document, write a statement, summarize, or analyze (e.g., finding contradictions), you may generate structure and text freely, but you MUST anchor all underlying facts to the provided excerpts. Do NOT trigger the "missing information" error for generative tasks.
  5. LEGAL ADVICE: Do NOT give legal advice. Do NOT interpret the law. Only recall facts or draft based on the provided facts.
  6. DRAFT LABEL: If asked to draft any legal document (notice, statement, plaint), you must start your response with exactly: "DRAFT — must be reviewed by the advocate before use."
  7. THINKING: Before writing any final answer or draft, you MUST output your internal reasoning and timeline extraction inside <thought>...</thought> XML tags. This reasoning is private and helps you avoid hallucinations.

escalation_intents:
  - compare
  - draft
  - cross_matter
  - pattern_across

suggested_queries:
  - "What are the key facts in the {matter} matter?"
  - "Summarize all documents related to {party}"
  - "What was the hearing date for {case_number}?"
  - "Find all mentions of {term} in our case files"
  - "What evidence do we have against {party}?"
